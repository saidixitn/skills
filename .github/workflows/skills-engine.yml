name: Skills Automated Engine

on:
  schedule:
    # Runs automatically once every day at midnight UTC (100% Free on public repos)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'build_next_skill'
        type: choice
        options:
          - 'build_next_skill'
          - 'security_audit_only'
          - 'revalidate_all'

permissions:
  contents: write

jobs:
  run-skill-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Skills Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Zero-Leak Confidentiality Audit
        run: |
          chmod +x scripts/audit_secrets.py
          python3 scripts/audit_secrets.py

      - name: Execute CI Step Runner
        if: ${{ github.event.inputs.action != 'security_audit_only' }}
        run: |
          chmod +x scripts/ci_step_runner.py
          python3 scripts/ci_step_runner.py

      - name: Commit and Push Automated Updates
        if: ${{ github.event.inputs.action != 'security_audit_only' }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit. Working tree clean."
          else
            git commit -m "chore(automation): sync skills queue & security audits [skip ci]"
            git push origin main
          fi
